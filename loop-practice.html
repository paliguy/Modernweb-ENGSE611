<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop practice</title>
</head>
<body>
    <button class="btn" onclick="runLoop()">Run Code</button>
    <div id="outputBox" style="white-space: pre-line;"></div>
    <script>
        function runLoop() {
            let maxNumber = 10; 
            let outputText = "";
            for (let i = 0; i <= maxNumber; i++) {
                if (i % 2 === 0) {
                    outputText += i + " (คู่)\n";
                    console.log(i + " (คู่)");
                } else {
                    outputText += i + " (คี่)\n";
                    console.log(i + " (คี่)");
                }
            }
            for (let i = 0; i <= maxNumber; i += 2) {
                outputText += "นับทีละ 2: " + i + "\n";
                console.log("นับทีละ 2: " + i);
            }
            for (let i = 10; i >= 0; i--) {
                outputText += "ถอยหลัง: " + i + "\n";
                console.log("ถอยหลัง: " + i);
            }
            document.getElementById("outputBox").textContent = outputText;
        }
    </script>
</body>
</html>
